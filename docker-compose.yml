services:
  chain:
    image: ghcr.io/foundry-rs/foundry:latest
    command: anvil --chain-id 20260619 --host 0.0.0.0 --port 8545 --block-time 2
    ports:
      - "8588:8545"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
